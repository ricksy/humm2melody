[project]
name = "humm2melody"
version = "0.11.1"
description = "Hum a melody into your microphone and get the notes to play on a keyboard."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.14.0",
    "textual>=0.60",
]

[project.scripts]
humm2melody = "humm2melody.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["humm2melody"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
